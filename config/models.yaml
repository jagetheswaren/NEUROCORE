# NEUROCORE Model Router Configuration

default_tier: fast

tiers:
  fast:
    model: qwen3:8b
    thinking: false
    temperature: 0.7
    max_tokens: 400
    description: "Fast conversational responses for casual chat and status queries."

  reasoning:
    model: qwen3:8b
    thinking: true
    temperature: 0.2
    max_tokens: 2048
    description: "Deep step-by-step reasoning for architectural design and complex problem solving."

  coding:
    model: qwen2.5-coder:7b
    thinking: false
    temperature: 0.1
    max_tokens: 2048
    description: "Specialized model for Python, JavaScript, HTML/CSS code generation and refactoring."

  vision:
    model: qwen3-vl:8b
    thinking: false
    temperature: 0.5
    max_tokens: 1024
    description: "Multimodal vision model for processing images and UI mockups."
